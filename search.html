{% extends "base.html" %}

{% block content %}
<h1>Kullanıcı Ara</h1>

<form action="{{ url_for('search') }}" method="get">
    <input type="text" name="q" placeholder="Kullanıcı adı ara..." value="{{ query }}">
    <button type="submit" class="btn">Ara</button>
</form>

<div class="card">
    {% if users %}
        {% for user in users %}
        <div class="user-card">
            <img src="{{ url_for('static', filename='profile_pics/' + user.profile_pic) }}" alt="{{ user.username }}">
            <div>
                <h3>{{ user.username }}</h3>
                <p>{{ user.bio or 'Henüz bir bio yazılmamış' }}</p>
                <a href="{{ url_for('add_friend', friend_id=user.id) }}" class="btn">Arkadaş Ekle</a>
            </div>
        </div>
        {% endfor %}
    {% else %}
        <p>Sonuç bulunamadı</p>
    {% endif %}
</div>
{% endblock %}
